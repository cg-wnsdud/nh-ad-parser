[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nh-ad-parser"
version = "0.1.0"
description = "NH 광고물 파싱 파이프라인 — 입력(PDF/이미지/HWP) → 글자·좌표·영역 JSON"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    # **정확한 버전으로 못박는다.** pdfium 은 마이너 버전 사이에서도 같은 PDF 를 다른
    # 픽셀로 래스터화하고, 그러면 OCR 이 다르게 읽는다. 실측(2026-08-24): 5.12.0 과
    # 5.13.0 이 같은 페이지를 같은 dpi 로 렌더했는데 픽셀 해시가 달랐고 파싱 결과가
    # 69줄 중 글자 3건·좌표 13건 갈렸다. 폐쇄망에 whl 을 반입하므로 여기서 못박아야
    # 개발·시연·납품이 같은 결과를 낸다.
    "pypdfium2==5.12.0",
    "pillow>=10.0",
    "requests>=2.32",
]

# HWP/HWPX 입력은 사내 `document-processor` 가 있어야 한다. 사설 저장소라
# 여기에 git URL 로 못 박으면 접근 권한 없는 곳에서 `uv sync` 자체가 실패한다.
# ingest/hwp.py 가 함수 안에서 지연 import 하므로 없으면 HWP 경로만 막히고
# PDF·이미지 트랙은 정상 동작한다. 설치법은 README 의 "HWP 입력" 절 참고.

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nh_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
